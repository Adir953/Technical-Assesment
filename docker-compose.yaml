services:
  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME:-technical_assessment_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Montar el script de schema para crear las tablas automáticamente
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # Montar el script de datos de ejemplo (opcional)
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      # Volumen persistente para datos
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================================
  # Adminer - Web UI para gestionar la base de datos
  # ==============================================================================
  adminer:
    image: adminer:latest
    container_name: database-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tap-network
    restart: unless-stopped

  # ==============================================================================
  # Backend API Principal (TypeScript + Express)
  # ==============================================================================
  backend-api:
    build:
      context: ./back-end-main-node
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-technical_assessment_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      PYTHON_RUNNER_URL: http://python-runner:8000/run
      NODE_RUNNER_URL: http://node-runner:8000/run
      JAVA_RUNNER_URL: http://java-runner:8000/run
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # Frontend (Angular + nginx). nginx reenvía /api/* a backend-api:3000
  # ==============================================================================
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend-api
    networks:
      - tap-network
    restart: unless-stopped

  # ==============================================================================
  # Python Runner (Ejecutor de código Python)
  # ==============================================================================
  python-runner:
    build:
      context: ./back-end-executer-nodes
      dockerfile: Dockerfile.python
    container_name: python-runner
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      RUNTIME: python
    ports:
      - "8001:8000"
    networks:
      - tap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # Node Runner (Ejecutor de código JavaScript/Node)
  # ==============================================================================
  node-runner:
    build:
      context: ./back-end-executer-nodes
      dockerfile: Dockerfile.node
    container_name: node-runner
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      RUNTIME: node
    ports:
      - "8002:8000"
    networks:
      - tap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # Java Runner (Ejecutor de código Java)
  # ==============================================================================
  java-runner:
    build:
      context: ./back-end-executer-nodes
      dockerfile: Dockerfile.java
    container_name: java-runner
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      RUNTIME: java
    ports:
      - "8003:8000"
    networks:
      - tap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  tap-network:
    driver: bridge
