# ==============================================================================
# Configuración común de los runners. El código del candidato corre como el usuario
# sin privilegios "sandbox"; el servidor del runner es root sin capabilities, salvo las
# necesarias para lanzar procesos como sandbox (SETUID, SETGID) y matarlos (KILL).
# ==============================================================================
x-runner: &runner
  # tini como PID 1: recoge los procesos huérfanos que deja el código del candidato; sin él
  # quedan zombies que siguen ocupando el límite de procesos.
  init: true
  networks:
    - runner-network
  restart: unless-stopped
  read_only: true
  # /tmp es el único lugar escribible y solo para root (mode 0755): el usuario sandbox no puede
  # crear, modificar ni borrar archivos. noexec impide ejecutar binarios copiados ahí.
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0755
  cap_drop:
    - ALL
  cap_add:
    - SETUID
    - SETGID
    - KILL
  security_opt:
    - no-new-privileges:true
  cpus: 1.0
  mem_limit: 512m
  memswap_limit: 512m
  pids_limit: 64
  # nproc limita los procesos e hilos del usuario sandbox (root no está sujeto a este límite),
  # así un fork bomb no agota pids_limit y el servidor puede seguir lanzando procesos.
  ulimits:
    nofile: 256
    nproc: 48
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME:-technical_assessment_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Montar el script de schema para crear las tablas automáticamente
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # Montar el script de datos de ejemplo (opcional)
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      # Volumen persistente para datos
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================================
  # Adminer - Web UI para gestionar la base de datos
  # ==============================================================================
  adminer:
    image: adminer:latest
    container_name: database-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tap-network
    restart: unless-stopped

  # ==============================================================================
  # Backend API Principal (TypeScript + Express)
  # ==============================================================================
  backend-api:
    build:
      context: ./back-end-main-node
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-technical_assessment_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      PYTHON_RUNNER_URL: http://python-runner:8000/run
      NODE_RUNNER_URL: http://node-runner:8000/run
      JAVA_RUNNER_URL: http://java-runner:8000/run
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tap-network
      - runner-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # Frontend (Angular + nginx). nginx reenvía /api/* a backend-api:3000
  # ==============================================================================
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend-api
    networks:
      - tap-network
    restart: unless-stopped

  # ==============================================================================
  # Runners (Python, Node, Java): ejecutan el código del candidato.
  # Solo están en runner-network, una red interna sin salida a internet y sin acceso a
  # PostgreSQL; únicamente backend-api puede llamarlos. No publican puertos en el host.
  # ==============================================================================
  python-runner:
    <<: *runner
    build:
      context: ./back-end-executer-nodes
      dockerfile: Dockerfile.python
    container_name: python-runner
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      RUNTIME: python

  node-runner:
    <<: *runner
    build:
      context: ./back-end-executer-nodes
      dockerfile: Dockerfile.node
    container_name: node-runner
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      RUNTIME: node

  java-runner:
    <<: *runner
    build:
      context: ./back-end-executer-nodes
      dockerfile: Dockerfile.java
    container_name: java-runner
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      RUNTIME: java
    # javac y la JVM necesitan más memoria e hilos que Python o Node.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  tap-network:
    driver: bridge
  # internal: sin salida a internet. Solo backend-api y los runners están conectados.
  runner-network:
    driver: bridge
    internal: true
