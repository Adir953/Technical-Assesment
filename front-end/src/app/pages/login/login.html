<section class="card narrow">
  <h1>Iniciar sesión</h1>
  <p class="muted">Ingresa con tu usuario y contraseña.</p>

  <form class="login-form" (submit)="submit($event)">
    <label class="field">
      Usuario
      <input name="username" autocomplete="username" required autofocus
             [value]="username()" (input)="username.set($any($event.target).value)" />
    </label>
    <label class="field">
      Contraseña
      <input name="password" type="password" autocomplete="current-password" required
             [value]="password()" (input)="password.set($any($event.target).value)" />
    </label>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <button class="btn btn-primary btn-block" type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="muted hint">
    Cuentas de prueba: <code>usuario / usuario</code> · <code>estudiante / estudiante</code> · <code>admin / admin</code>
  </p>
</section>
