server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend corre en la red interna de docker-compose (servicio backend-api).
    location /api/ {
        proxy_pass http://backend-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La ejecución de código puede tardar (compilación Java + casos de prueba).
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    location /assets/monaco/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Rutas del SPA: cualquier ruta desconocida devuelve index.html.
    # no-cache obliga al navegador a revalidar (ETag) y evita que sirva un build viejo desde caché,
    # p. ej. al duplicar una pestaña.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
